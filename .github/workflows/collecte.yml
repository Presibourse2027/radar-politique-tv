name: Collecte des émissions politiques

on:
  schedule:
    - cron: "17 3-21/2 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "filtres.json"
      - "collect.py"
      - "annonces.py"
      - "replays.py"
      - "plateformes.py"

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Collecter la grille TV, les annonces et filtrer
        run: python3 collect.py

      - name: Publier le résultat
        run: |
          git config user.name "robot-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/sortie
          cp data/programmes.json /tmp/sortie/
          [ -f data/diagnostic_replays.json ] && cp data/diagnostic_replays.json /tmp/sortie/ || true
          for essai in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/sortie/*.json data/
            git add data/*.json
            if git diff --cached --quiet; then
              echo "Aucun changement."
              exit 0
            fi
            git commit -m "Grille du $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push; then
              exit 0
            fi
            echo "Envoi refusé, nouvel essai dans 10 s"
            sleep 10
          done
          exit 1
