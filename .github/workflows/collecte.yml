name: Collecte des émissions politiques

on:
  schedule:
    - cron: "17 3-21/2 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "filtres.json"
      - "collect.py"
      - "annonces.py"

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Collecter la grille TV, les annonces et filtrer
        run: python3 collect.py

      - name: Publier le résultat
        run: |
          git config user.name "robot-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/programmes.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Grille du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
